# CI: lint, testes unitários, validação do Terraform e teste de integração de ponta a ponta
# (docker compose + pipeline completo + smoke test na API).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install "ruff>=0.16,<0.17"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  integration:
    name: Integração (docker compose + pipeline + smoke test)
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Evita baixar o dataset do Kaggle a cada execução.
      - name: Cache do dataset
        id: dataset-cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/train.csv
            data/raw/test.csv
          key: kaggle-telemarketing-jyb-v1

      - name: Baixa o dataset do Kaggle
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/dataset.zip https://www.kaggle.com/api/v1/datasets/download/aguado/telemarketing-jyb-dataset
          unzip -o /tmp/dataset.zip -d data/raw

      - name: Sobe a stack (todos os serviços, esperando os healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Pipeline (dados -> Feast -> simulação/MLflow -> Golden Set)
        run: docker compose --profile pipeline run --rm pipeline

      - name: Smoke test da API
        run: python3 scripts/smoke_test.py --url http://localhost:8000 --wait 120

      - name: Logs dos serviços (em caso de falha)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Derruba a stack
        if: always()
        run: docker compose --profile pipeline down -v
