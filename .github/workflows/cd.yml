# CD: após o CI passar na main (ou manualmente), publica as imagens no Azure Container Registry
# com a tag do commit, atualiza os Container Apps (MLflow e API) e o Job do pipeline, opcionalmente
# roda o pipeline e valida a API pública com um smoke test.
#
# Pré-requisitos (uma vez só):
#   1. terraform apply com github_repository = "<owner>/<repo>"
#   2. GitHub > Settings > Environments > "production" com as variáveis (outputs do Terraform):
#        AZURE_CLIENT_ID       = output github_azure_client_id
#        AZURE_TENANT_ID       = output github_azure_tenant_id
#        AZURE_SUBSCRIPTION_ID = output github_azure_subscription_id
#        PROJECT_PREFIX        = <project_name>-<environment> (padrão datathon-mab-dev)
#   3. GitHub > Settings > Secrets and variables > Actions > Variables (repositório):
#        CD_ENABLED            = true   (liga o deploy; sem ela o job é pulado)
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "Rodar o pipeline (dados -> Feast -> simulação) no Container Apps Job após o deploy"
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC com o Entra ID
  contents: read

jobs:
  deploy:
    name: Deploy na Azure (ACR + Container Apps)
    # CD_ENABLED é variável de REPOSITÓRIO (as do environment só existem depois que o job começa):
    # enquanto a Azure não estiver configurada, o deploy é pulado em vez de falhar.
    if: >-
      vars.CD_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      PREFIX: ${{ vars.PROJECT_PREFIX || 'datathon-mab-dev' }}
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login na Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Descobre os recursos
        run: |
          RESOURCE_GROUP="rg-$PREFIX"
          ACR_NAME=$(az acr list --resource-group "$RESOURCE_GROUP" --query '[0].name' --output tsv)
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)
          {
            echo "RESOURCE_GROUP=$RESOURCE_GROUP"
            echo "ACR_NAME=$ACR_NAME"
            echo "APP_IMAGE=$LOGIN_SERVER/datathon-mab-app:$IMAGE_TAG"
            echo "MLFLOW_IMAGE=$LOGIN_SERVER/datathon-mab-mlflow:$IMAGE_TAG"
          } >> "$GITHUB_ENV"

      - name: Build e push das imagens
        run: |
          az acr login --name "$ACR_NAME"
          docker build -t "$APP_IMAGE" .
          docker build -t "$MLFLOW_IMAGE" docker/mlflow
          docker push "$APP_IMAGE"
          docker push "$MLFLOW_IMAGE"

      # `az containerapp update` cria uma nova revisão e só a coloca no ar se ela ficar saudável.
      - name: Deploy do MLflow
        run: az containerapp update --name "$PREFIX-mlflow" --resource-group "$RESOURCE_GROUP" --image "$MLFLOW_IMAGE" --output none

      - name: Deploy da API
        run: az containerapp update --name "$PREFIX-api" --resource-group "$RESOURCE_GROUP" --image "$APP_IMAGE" --output none

      - name: Atualiza a imagem do Job do pipeline
        run: az containerapp job update --name "$PREFIX-pipeline" --resource-group "$RESOURCE_GROUP" --image "$APP_IMAGE" --output none

      - name: Roda o pipeline (Container Apps Job)
        if: inputs.run_pipeline || vars.RUN_PIPELINE_ON_DEPLOY == 'true'
        run: |
          JOB="$PREFIX-pipeline"
          EXECUTION=$(az containerapp job start --name "$JOB" --resource-group "$RESOURCE_GROUP" --query name --output tsv)
          echo "Execução iniciada: $EXECUTION"
          for _ in $(seq 1 90); do
            STATUS=$(az containerapp job execution show --name "$JOB" --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION" --query properties.status --output tsv)
            echo "Status: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "Pipeline falhou (logs no Log Analytics: ContainerAppConsoleLogs_CL)"; exit 1 ;;
            esac
            sleep 20
          done
          echo "Tempo esgotado aguardando o pipeline"; exit 1

      # Em produção o smoke test não envia feedback, para não alterar os contadores reais do bandit.
      - name: Smoke test na API pública
        run: |
          FQDN=$(az containerapp show --name "$PREFIX-api" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          python3 scripts/smoke_test.py --url "https://$FQDN" --wait 300 --no-feedback
